name: Deploy WAVEX to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare numbered image placeholders
        run: node prepare-pages.js

      - name: Enhance packaging comparison
        run: node enhance-comparison.js

      - name: Rebuild hero composition
        run: node fix-hero.js

      - name: Add packaging typography names
        run: node apply-font.js

      - name: Rebuild design strategy
        run: node enhance-design-strategy.js

      - name: Fix Design Strategy image mapping
        run: node fix-design-strategy-map.js

      - name: Apply responsive compatibility fixes
        run: node responsive-fixes.js

      - name: Apply responsive image compatibility
        run: node smart-media.js

      - name: Optimize cinematic responsive performance
        run: node cinematic-performance.js

      - name: Fix Big Idea responsive media
        run: node fix-big-idea-media.js

      - name: Apply final image frame fixes
        run: node fix-image-frames.js

      - name: Remove Big Idea letterboxing
        run: node fix-big-idea-letterbox.js

      - name: Rebuild Moodboard editorial layout
        run: node fix-moodboard.js

      - name: Rebuild Visual Experience layout
        run: node fix-visual-experience.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
